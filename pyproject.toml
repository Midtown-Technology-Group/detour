[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "detour"
version = "0.1.0"
description = "Track the work you did to get back to the work you meant to do."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "platformdirs>=4.0",
  "rich>=13.0",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
detour = "detour.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/detour"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
