[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "detour"
version = "0.1.3"
description = "Track the work you did to get back to the work you meant to do."
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
  { name = "Midtown Technology Group LLC" },
]
keywords = ["cli", "notes", "logseq", "productivity", "agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: GNU Affero General Public License v3",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business",
  "Topic :: Utilities",
]
dependencies = [
  "platformdirs>=4.0",
  "rich>=13.0",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.8",
  "pip-audit>=2.7",
  "pytest>=8.0",
  "pytest-cov>=7.0",
  "ruff>=0.4",
  "twine>=5.0",
]

[project.scripts]
detour = "detour.cli:app"

[project.urls]
Homepage = "https://midtown-technology-group.github.io/detour/"
Repository = "https://github.com/Midtown-Technology-Group/detour"
Issues = "https://github.com/Midtown-Technology-Group/detour/issues"
Changelog = "https://github.com/Midtown-Technology-Group/detour/blob/main/CHANGELOG.md"
Security = "https://github.com/Midtown-Technology-Group/detour/blob/main/SECURITY.md"

[tool.hatch.build.targets.wheel]
packages = ["src/detour"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["detour"]

[tool.coverage.report]
fail_under = 75
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/detour"]
