name: tickgit TODO guard

on:
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: "17 13 * * 1-5"
  workflow_dispatch:

concurrency:
  group: tickgit-todo-guard-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  todo-guard:
    name: Detect new TODO comments
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: MTG-Thomas/tickgit@v0.0.17
        with:
          baseline-file: .github/tickgit-baseline.csv
          fail-on-new: "true"
          match-phrases: TODO,FIXME,HACK
          ignore-paths: node_modules,site,output
