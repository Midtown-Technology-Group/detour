name: Bug Report
description: Report something that is broken in detour.
title: "Bug: "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Include commands and relevant config with secrets removed.
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: detour version
      placeholder: "v0.1.3"
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "Windows 11 / PowerShell 7"
  - type: textarea
    id: logs
    attributes:
      label: Output or logs
      render: text
